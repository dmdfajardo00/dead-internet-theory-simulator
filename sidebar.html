<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIT Simulator - Redesigned Sidebar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5; /* A more facebook-like background */
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 2rem;
            min-height: 100vh;
        }
        /* Styles for the drop zone */
        .drop-zone {
            border: 2px dashed #94a3b8;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .drop-zone.drag-over {
            background-color: #dbeafe;
            border-color: #3b82f6;
        }
        /* Styles for the draggable persona cards */
        .persona-card {
            cursor: grab;
            transition: transform 0.2s;
        }
        .persona-card:active {
            cursor: grabbing;
            transform: scale(0.95);
        }
        /* Hide original element while dragging */
        .dragging {
            opacity: 0.5;
        }
        /* Simple animation for adding/removing items */
        @keyframes pop-in {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .selected-avatar, .persona-card {
            animation: pop-in 0.3s ease-out;
        }
        /* Styling for the remove button */
        .remove-btn {
            display: none; /* Hidden by default */
            position: absolute;
            bottom: -5px;
            right: -5px;
            background-color: #ef4444;
            color: white;
            border-radius: 9999px;
            width: 24px;
            height: 24px;
            font-weight: bold;
            border: 2px solid white;
            cursor: pointer;
        }
        .selected-avatar:hover .remove-btn {
            display: flex; /* Show on hover */
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- Right Panel: Settings (Redesigned) -->
    <div class="w-full max-w-md bg-gray-50 p-4 md:p-6 lg:p-8 rounded-xl shadow-lg">
        <!-- Kept the tabs for context, but focus is on Orchestrator -->
        <div class="flex border-b mb-6">
            <div class="font-semibold py-2 px-4 border-b-2 border-blue-500 text-blue-500">Orchestrator</div>
            <div class="py-2 px-4 text-gray-500">Edit Text</div>
        </div>

        <!-- Orchestrator View -->
        <div>
            <div class="mb-6">
                <label for="seed-topic" class="block text-sm font-medium text-gray-700 mb-2">Seed Topic</label>
                <input type="text" id="seed-topic" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="e.g., Is remote work the future?">
            </div>

            <!-- Participant Indicators -->
            <div class="mb-2">
                <label class="block text-sm font-medium text-gray-700">Participants</label>
                <div id="participant-indicators" class="flex items-center space-x-2 h-6">
                    <!-- Indicators will be added here -->
                    <span class="text-gray-400 italic">Drag personas into the box below</span>
                </div>
            </div>

            <!-- Drag and Drop Box -->
            <div id="drop-zone" class="drop-zone bg-gray-100 rounded-lg min-h-[100px] p-3 flex flex-wrap gap-4 items-start">
                <!-- Selected personas will appear here -->
            </div>

            <div class="border-t my-6"></div>

            <!-- Pre-defined list of Personas -->
            <div>
                <h3 class="font-semibold text-gray-800 mb-3">Persona Library</h3>
                <div id="persona-library" class="space-y-4 max-h-[40vh] overflow-y-auto pr-2">
                    <!-- Persona cards will be injected by JS -->
                </div>
            </div>

            <button id="start-simulation" class="w-full bg-green-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-green-700 transition duration-300 mt-6 disabled:bg-gray-400" disabled>Start Simulation</button>
        </div>
    </div>

    <script>
        // --- Mock Data ---
        const allPersonas = [
            { id: '1', name: 'Brenda', picture: 'https://placehold.co/80x80/f87171/ffffff?text=B', bio: 'Fiscal conservative, believes in free markets and minimal government intervention. Skeptical of new regulations.' },
            { id: '2', name: 'Kevin', picture: 'https://placehold.co/80x80/60a5fa/ffffff?text=K', bio: 'Progressive activist, passionate about social justice, climate change, and universal healthcare.' },
            { id: '3', name: 'Linda', picture: 'https://placehold.co/80x80/facc15/ffffff?text=L', bio: 'Centrist mom, values practicality and compromise. Worried about political polarization.' },
            { id: '4', name: 'Doug', picture: 'https://placehold.co/80x80/4ade80/ffffff?text=D', bio: 'Libertarian tech bro, believes in individual liberty and technological solutions to everything. Hates taxes.' },
            { id: '5', name: 'Samantha', picture: 'https://placehold.co/80x80/c084fc/ffffff?text=S', bio: 'Academic and historian, provides nuanced, evidence-based arguments. Tries to stay above the fray.' }
        ];

        // --- State ---
        let availablePersonas = [...allPersonas];
        let selectedPersonas = [];

        // --- DOM Elements ---
        const dropZone = document.getElementById('drop-zone');
        const personaLibrary = document.getElementById('persona-library');
        const indicatorsContainer = document.getElementById('participant-indicators');
        const startBtn = document.getElementById('start-simulation');

        // --- Drag and Drop Logic ---
        let draggedElement = null;

        document.addEventListener('dragstart', (e) => {
            if (e.target.classList.contains('persona-card')) {
                draggedElement = e.target;
                setTimeout(() => e.target.classList.add('dragging'), 0);
            }
        });

        document.addEventListener('dragend', (e) => {
            if (draggedElement) {
                draggedElement.classList.remove('dragging');
                draggedElement = null;
            }
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault(); // Necessary to allow dropping
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            if (draggedElement && draggedElement.classList.contains('persona-card')) {
                const personaId = draggedElement.dataset.id;
                movePersona(personaId, 'select');
            }
        });

        // --- Core Functions ---
        function movePersona(personaId, direction) {
            if (direction === 'select') {
                const persona = availablePersonas.find(p => p.id === personaId);
                if (persona) {
                    selectedPersonas.push(persona);
                    availablePersonas = availablePersonas.filter(p => p.id !== personaId);
                }
            } else { // direction === 'deselect'
                const persona = selectedPersonas.find(p => p.id === personaId);
                if (persona) {
                    availablePersonas.push(persona);
                    selectedPersonas = selectedPersonas.filter(p => p.id !== personaId);
                }
            }
            // Sort available personas to keep a consistent order
            availablePersonas.sort((a,b) => parseInt(a.id) - parseInt(b.id));
            render();
        }

        function render() {
            // Render Persona Library
            personaLibrary.innerHTML = '';
            availablePersonas.forEach(p => {
                const card = document.createElement('div');
                card.className = 'persona-card bg-white rounded-lg shadow p-3 flex items-center space-x-3';
                card.draggable = true;
                card.dataset.id = p.id;
                card.innerHTML = `
                    <img src="${p.picture}" alt="${p.name}" class="w-12 h-12 rounded-full pointer-events-none">
                    <div>
                        <h4 class="font-bold text-md">${p.name}</h4>
                        <p class="text-sm text-gray-600">${p.bio}</p>
                    </div>
                `;
                personaLibrary.appendChild(card);
            });

            // Render Selected Personas in Drop Zone
            dropZone.innerHTML = '';
            selectedPersonas.forEach(p => {
                const avatar = document.createElement('div');
                avatar.className = 'selected-avatar relative';
                avatar.dataset.id = p.id;
                avatar.innerHTML = `
                    <img src="${p.picture}" alt="${p.name}" title="${p.name}: ${p.bio}" class="w-16 h-16 rounded-full shadow-md pointer-events-none">
                    <button class="remove-btn" onclick="movePersona('${p.id}', 'deselect')">X</button>
                `;
                dropZone.appendChild(avatar);
            });

            // Render Indicators
            indicatorsContainer.innerHTML = '';
            if (selectedPersonas.length === 0) {
                 indicatorsContainer.innerHTML = `<span class="text-gray-400 italic">Drag personas into the box below</span>`;
            } else {
                selectedPersonas.forEach(p => {
                    const indicator = document.createElement('img');
                    indicator.src = p.picture;
                    indicator.alt = p.name;
                    indicator.title = p.name;
                    indicator.className = 'w-6 h-6 rounded-full ring-2 ring-white';
                    indicatorsContainer.appendChild(indicator);
                });
            }
            
            // Update Start Button state
            startBtn.disabled = selectedPersonas.length < 2;
        }

        // --- Initial Render ---
        render();
    </script>
</body>
</html>
